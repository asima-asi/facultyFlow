<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FacultyFlow - Final Fixed</title>
<style>
:root{--green-bg:#dcfce7;--green-text:#166534;--red-bg:#fee2e2;--red-text:#991b1b;--blue-bg:#dbeafe;--blue-text:#1e40af;--yellow-bg:#fef3c7;--yellow-text:#92400e;--pink-bg:#fce7f3;--pink-text:#9d174d}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
body{background:#f8fafc;display:flex;min-height:100vh}
.sidebar{width:270px;background:linear-gradient(180deg,#0f172a,#1e1b4b);color:#94a3b8;position:fixed;height:100vh;padding:22px 14px;display:flex;flex-direction:column}
.logo{color:white;font-size:23px;font-weight:800;padding:0 12px 4px}.sub-logo{font-size:11px;padding:0 12px 28px;color:#64748b;font-weight:700;letter-spacing:0.8px}
.menu li{padding:13px 14px;border-radius:14px;margin:5px 0;cursor:pointer;list-style:none;transition:0.2s}
.menu li.active{background:#6366f1;color:white}.menu li:hover{background:#1e293b;color:white}
.main{margin-left:270px;flex:1;padding:32px;background:linear-gradient(180deg,#eef2ff,#f8fafc)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
.card{background:white;border-radius:20px;padding:22px;border:1px solid #e2e8f0;box-shadow:0 4px 20px rgba(0,0,0,0.04)}
.card-c1{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);border-color:#a5b4fc}.card-c2{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-color:#86efac}.card-c3{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#fcd34d}.card-c4{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#fca5a5}
.pill{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700}
.pill-green{background:var(--green-bg);color:var(--green-text)}.pill-red{background:var(--red-bg);color:var(--red-text)}.pill-blue{background:var(--blue-bg);color:var(--blue-text)}.pill-yellow{background:var(--yellow-bg);color:var(--yellow-text)}.pill-pink{background:var(--pink-bg);color:var(--pink-text)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
table{width:100%;border-collapse:collapse;background:white;border-radius:20px;overflow:hidden;border:1px solid #e2e8f0}
th{background:#0f172a;color:white;padding:16px 18px;text-align:left;font-size:13px}td{padding:16px 18px;border-bottom:1px solid #f1f5f9;font-size:14px}
.btn-blue{background:#6366f1;color:white;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.login-wrap{min-height:100vh;width:100vw;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 30%,#f093fb 70%,#f5576c 100%);position:fixed;z-index:100;top:0;left:0}
.login-card{background:white;padding:40px 36px;border-radius:24px;width:400px;box-shadow:0 25px 80px rgba(0,0,0,0.35)}
.login-card select,.login-card input{width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid #e2e8f0;margin-bottom:14px;font-size:14px;outline:none;margin-top:12px;background:#f8fafc}
.login-card button{width:100%;background:#0f172a;color:white;padding:15px;border-radius:14px;border:none;font-weight:700;cursor:pointer}
.time-grid{display:grid;grid-template-columns:80px repeat(6,1fr);gap:1px;background:#e2e8f0;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0}
.time-cell{background:white;padding:14px 8px;font-size:13px;text-align:center}.time-header{background:#0f172a;color:white;padding:14px 8px;font-size:13px;font-weight:700;text-align:center}
.reminder-card{background:white;border-radius:16px;padding:18px;border:1px solid #e2e8f0;display:flex;gap:12px;margin-bottom:14px;border-left:4px solid #6366f1}
.hidden{display:none!important}.faculty-card{background:white;border-radius:20px;padding:20px;border:1px solid #e2e8f0}.faculty-top{display:flex;justify-content:space-between;margin-bottom:14px}
</style></head><body>
<div id="loginPage" class="login-wrap"><div class="login-card"><div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800">F</div><div><h2 style="font-size:24px;font-weight:800">FacultyFlow</h2><div style="font-size:11px;font-weight:700;color:#6366f1;letter-spacing:0.8px">SECURE ACCESS</div></div></div><div style="font-size:13px;color:#64748b;margin:18px 0 8px">Please sign in to continue</div><select id="roleSelect"><option value="">Select Role</option><option value="admin">Admin</option><option value="faculty">Faculty</option><option value="student">Student</option></select><input id="nameInput" placeholder="Username"/><div id="errorMsg" style="color:#ef4444;font-size:12px;font-weight:600;margin-bottom:10px;display:none"></div><button onclick="login()">Login</button><div style="margin-top:16px;font-size:11px;color:#94a3b8;background:#f8fafc;padding:10px;border-radius:10px;text-align:center">Admin: Asin | Faculty: Priya | Student: Rahul</div></div></div>
<div id="app" class="hidden" style="width:100%"><div class="sidebar"><div class="logo">FacultyFlow</div><div id="roleLabel" class="sub-logo">ADMIN</div><ul class="menu" id="menuList"></ul><div style="margin-top:auto;padding:14px;background:#1e293b;border-radius:14px"><div id="loggedName" style="color:white;font-weight:700;font-size:13px"></div><button onclick="location.reload()" style="margin-top:10px;width:100%;background:#334155;color:white;border:none;padding:9px;border-radius:10px;font-size:12px;cursor:pointer">Logout</button></div></div><div class="main"><h1 id="pageTitle" style="font-size:26px;font-weight:800;margin-bottom:24px">Dashboard</h1><div id="contentArea"></div></div></div>
<script>
let currentRole='admin';
const facultyData=[{name:'Dr. Priya Sharma',code:'A-101 • 12 Years',status:'FREE NOW',statusClass:'pill-green',tags:['DBMS','DBMS Lab']},{name:'Prof. Arjun Kumar',code:'B-202 • 8 Years',status:'IN CLASS (9-10)',statusClass:'pill-red',tags:['OS','CN']},{name:'Dr. Kavya R.',code:'C-303 • 15 Years',status:'FREE NOW',statusClass:'pill-green',tags:['VLSI','SE']},{name:'Prof. Suresh',code:'A-102 • 10 Years',status:'IN LAB',statusClass:'pill-red',tags:['DBMS Lab']},{name:'Dr. Meena',code:'B-101 • 7 Years',status:'ON LEAVE',statusClass:'pill-red',tags:['AI']},{name:'Prof. Ravi',code:'C-102 • 5 Years',status:'FREE NOW',statusClass:'pill-green',tags:['ML']},{name:'Dr. Anjali',code:'A-201 • 11 Years',status:'FREE NOW',statusClass:'pill-green',tags:['CN']},{name:'Prof. Karthik',code:'B-203 • 9 Years',status:'IN CLASS',statusClass:'pill-red',tags:['OS']},{name:'Dr. Lakshmi',code:'C-201 • 13 Years',status:'FREE NOW',statusClass:'pill-green',tags:['SE']},{name:'Prof. Manoj',code:'A-103 • 6 Years',status:'FREE NOW',statusClass:'pill-green',tags:['DBMS']}];
// FIXED: Unique student names - no repeat
const students=[
['CSE001','Aarav Sharma','CSE-A','Present'],
['CSE002','Priya Verma','CSE-A','Absent'],
['CSE003','Rohan Kumar','CSE-A','Present'],
['CSE004','Ananya Singh','CSE-A','Late'],
['CSE005','Vikram Patel','CSE-A','Present'],
['CSE006','Sneha Reddy','CSE-A','Present'],
['CSE007','Aditya Rao','CSE-A','Absent'],
['CSE008','Kavya Nair','CSE-A','Present'],
['CSE009','Ishaan Gupta','CSE-A','Present'],
['CSE010','Diya Mehta','CSE-A','Late'],
['CSE011','Arjun Desai','CSE-A','Present'],
['CSE012','Neha Joshi','CSE-A','Present'],
['CSE013','Karthik Menon','CSE-A','Absent'],
['CSE014','Pooja Iyer','CSE-A','Present'],
['CSE015','Siddharth Malhotra','CSE-A','Present'],
['CSE016','Riya Kapoor','CSE-A','Late'],
['CSE017','Aman Singhania','CSE-A','Present'],
['CSE018','Tanya Bansal','CSE-A','Present'],
['CSE019','Harsh Vardhan','CSE-A','Absent'],
['CSE020','Shruti Agarwal','CSE-A','Present'],
['CSE021','Dev Patel','CSE-A','Present'],
['CSE022','Anjali Rao','CSE-A','Present'],
['CSE023','Rahul Khanna','CSE-B','Present'],
['CSE024','Meera Krishnan','CSE-B','Late'],
['CSE025','Nikhil Sethi','CSE-B','Present']
];
function login(){
  const r=document.getElementById('roleSelect').value;const n=document.getElementById('nameInput').value.trim().toLowerCase();const err=document.getElementById('errorMsg');err.style.display='none';
  if(!r){err.innerText='Please select role';err.style.display='block';return;}if(!n){err.innerText='Please enter username';err.style.display='block';return;}
  if(r==='admin'&&n!=='asin'){err.innerText='Invalid credentials for Admin';err.style.display='block';return;}
  if(r==='faculty'&&n!=='priya'){err.innerText='Invalid credentials for Faculty';err.style.display='block';return;}
  if(r==='student'&&n!=='rahul'){err.innerText='Invalid credentials for Student';err.style.display='block';return;}
  currentRole=r;document.getElementById('loginPage').classList.add('hidden');const app=document.getElementById('app');app.classList.remove('hidden');app.style.display='flex';document.getElementById('roleLabel').innerText=r.toUpperCase();document.getElementById('loggedName').innerText=n.toUpperCase()+' - '+r.toUpperCase();buildMenu();showPage('dashboard');
}
function buildMenu(){
  const am=[{id:'dashboard',label:'Dashboard'},{id:'timetable',label:'Timetable 9-4'},{id:'faculty',label:'Faculty'},{id:'students',label:'All Students (200+)'},{id:'reminders',label:'Reminders'}];
  const fm=[{id:'dashboard',label:'Dashboard'},{id:'timetable',label:'Timetable 9-4'},{id:'faculty',label:'Faculty'},{id:'mystudents',label:'My Students (62)'},{id:'profile',label:'My Profile'},{id:'reminders',label:'Reminders'}];
  const sm=[{id:'dashboard',label:'Dashboard'},{id:'timetable',label:'Timetable 9-4'},{id:'reminders',label:'Reminders'}];
  let m=currentRole==='admin'?am:currentRole==='faculty'?fm:sm;
  document.getElementById('menuList').innerHTML=m.map(x=>`<li id="m-${x.id}" onclick="showPage('${x.id}')" class="${x.id==='dashboard'?'active':''}">${x.label}</li>`).join('');
}
function showPage(p){
  document.querySelectorAll('.menu li').forEach(l=>l.classList.remove('active'));let e=document.getElementById('m-'+p);if(e)e.classList.add('active');
  document.getElementById('pageTitle').innerText=p==='dashboard'?'Dashboard':p==='timetable'?'Timetable 9-4':p==='faculty'?'All Faculty':p==='students'?'All Students':p==='mystudents'?'My Students':p==='profile'?'My Profile':'Reminders';
  let h='';
  if(p==='dashboard'){
    if(currentRole==='admin')h=`<div class="stats"><div class="card card-c1"><div style="font-size:11px;font-weight:700;color:#4338ca">TOTAL FACULTY</div><div style="font-size:30px;font-weight:800">10</div></div><div class="card card-c2"><div style="font-size:11px;font-weight:700;color:#166534">TOTAL STUDENTS</div><div style="font-size:30px;font-weight:800">200+</div></div><div class="card card-c3"><div style="font-size:11px;font-weight:700;color:#92400e">AVAILABLE NOW</div><div style="font-size:30px;font-weight:800">7 / 10</div></div><div class="card card-c4"><div style="font-size:11px;font-weight:700;color:#991b1b">IN CLASS / LAB</div><div style="font-size:30px;font-weight:800">3</div></div></div><div class="grid-3">${facultyData.slice(0,6).map(f=>facultyCard(f)).join('')}</div>`;
    else if(currentRole==='faculty')h=`<div class="stats"><div class="card card-c1"><div style="font-size:11px;font-weight:700">MY STUDENTS</div><div style="font-size:30px;font-weight:800">62</div></div><div class="card card-c2"><div style="font-size:11px;font-weight:700">MY SUBJECTS</div><div style="font-size:30px;font-weight:800">2</div></div><div class="card card-c3"><div style="font-size:11px;font-weight:700">TODAY CLASSES</div><div style="font-size:30px;font-weight:800">3</div></div><div class="card card-c4"><div style="font-size:11px;font-weight:700">STATUS</div><div style="margin-top:10px"><span class="pill pill-green">FREE NOW</span></div></div></div><div class="card" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border:none">Welcome Dr. Priya Sharma<br><span style="font-size:13px;opacity:0.9">Access your 62 CSE-A students from My Students section.</span></div>`;
    else h=`<div class="card">Student Dashboard - Timetable and Reminders only</div>`;
  }else if(p==='timetable'){h=`<div class="card"><div class="time-grid"><div class="time-header">Time</div><div class="time-header">Mon</div><div class="time-header">Tue</div><div class="time-header">Wed</div><div class="time-header">Thu</div><div class="time-header">Fri</div><div class="time-header">Sat</div><div class="time-cell">9-10</div><div class="time-cell"><span class="pill pill-blue">DBMS</span></div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">DBMS</span></div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">DBMS Lab</span></div><div class="time-cell">-</div><div class="time-cell">10-11</div><div class="time-cell"><span class="pill pill-blue">OS</span></div><div class="time-cell"><span class="pill pill-blue">DBMS</span></div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">CN</span></div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">11-12</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">SE</span></div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">12-1</div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell"><span class="pill pill-yellow">Lunch</span></div><div class="time-cell">1-2</div><div class="time-cell"><span class="pill pill-blue">DBMS Lab</span></div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">DBMS</span></div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">2-3</div><div class="time-cell">-</div><div class="time-cell"><span class="pill pill-blue">CN</span></div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">3-4</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div><div class="time-cell">-</div></div></div>`}
  else if(p==='faculty'){h=`<div class="grid-3">${facultyData.map(f=>facultyCard(f)).join('')}</div>`}
  else if(p==='students'){h=`<table><tr><th>Roll No</th><th>Name</th><th>Branch</th><th>Status</th><th>Action</th></tr>${students.slice(0,20).map((s,i)=>{const cl=s[3]==='Present'?'pill-green':s[3]==='Absent'?'pill-red':'pill-pink';return `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><span class="pill ${cl}">${s[3]}</span></td><td><button class="btn-blue">Message</button></td></tr>`}).join('')}</table>`}
  else if(p==='mystudents'){h=`<table><tr><th>Roll No</th><th>Name</th><th>Branch</th><th>Status</th><th>Action</th></tr>${students.slice(0,15).map(s=>{const cl=s[3]==='Present'?'pill-green':s[3]==='Absent'?'pill-red':'pill-pink';return `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><span class="pill ${cl}">${s[3]}</span></td><td><button class="btn-blue">Message</button></td></tr>`}).join('')}</table>`}
  else if(p==='profile'){h=`<div class="grid-3"><div class="faculty-card" style="border:2px solid #6366f1"><div class="faculty-top"><div><div style="font-weight:800">Dr. Priya Sharma</div><div style="font-size:12px;color:#64748b">A-101 - 12 Years</div></div><span class="pill pill-green">FREE NOW</span></div><div style="display:flex;gap:8px"><span class="pill pill-blue">DBMS</span><span class="pill pill-blue">DBMS Lab</span></div></div></div>`}
  else if(p==='reminders'){h=`<div class="reminder-card"><div><b>DBMS Assignment due 4 PM today</b><br><small>CSE-A - 62 Students - A-101</small></div></div><div class="reminder-card"><div><b>OS Lab Record submission tomorrow</b><br><small>B-202 - Lab-1</small></div></div><div class="reminder-card"><div><b>Faculty meeting at 2 PM - A Block</b><br><small>Important - All Faculty</small></div></div>`}
  document.getElementById('contentArea').innerHTML=h;
}
function facultyCard(f){return `<div class="faculty-card"><div class="faculty-top"><div><div style="font-weight:700;font-size:14px">${f.name}</div><div style="font-size:11px;color:#64748b">${f.code}</div></div><span class="pill ${f.statusClass}" style="font-size:10px">${f.status}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap">${f.tags.map(t=>`<span class="pill pill-blue" style="font-size:11px">${t}</span>`).join('')}</div></div>`}
</script></body></html>
